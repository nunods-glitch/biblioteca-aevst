<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca AEVST - Gestão de Espaços</title>
    <meta name="description" content="Aplicação para gestão e análise da utilização dos espaços da Biblioteca do AEVST." />
    <meta property="og:title" content="Biblioteca AEVST - Gestão de Espaços" />
    <meta property="og:description" content="Aplicação para gestão e análise da utilização dos espaços da Biblioteca do AEVST." />
    <script>
      // Intercept and swallow unhandled exceptions generated by browser extensions or userscripts (Greasemonkey/Tampermonkey)
      (function() {
        window.addEventListener('error', function(event) {
          var msg = (event && (event.message || (event.error && event.error.message))) || '';
          if (typeof msg === 'string' && (
            msg.indexOf('GM') !== -1 ||
            msg.indexOf('_0x') !== -1 ||
            msg.indexOf('can\'t access property') !== -1 ||
            msg.indexOf('script[') !== -1
          )) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var msg = (event && event.reason && (event.reason.message || String(event.reason))) || '';
          if (typeof msg === 'string' && (
            msg.indexOf('GM') !== -1 ||
            msg.indexOf('_0x') !== -1 ||
            msg.indexOf('script[') !== -1
          )) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
          }
        }, true);

        // Define a safe GM proxy so extension scripts accessing GM.info.script don't throw undefined property access
        try {
          if (!window.GM) {
            var safeProxy = new Proxy({}, {
              get: function() { return ""; }
            });
            window.GM = {
              info: {
                script: safeProxy
              }
            };
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
